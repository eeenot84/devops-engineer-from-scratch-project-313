[project]
name = "devops-engineer-from-scratch-project-313"
version = "0.1.0"
description = "Flask app with /ping, Sentry and Docker deploy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=23.0.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "sentry-sdk[flask]>=2.20.0",
    "sqlmodel>=0.0.39",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "ruff>=0.15.21",
]
