# CI/CD: SourceCraft → Yandex Container Registry → Serverless Containers
# Сервисное подключение: default-service-connection

tokens:
  SERVICE_CONNECTION:
    service_connection: default-service-connection
    scope: repo

on:
  push:
    - workflows: [deploy-workflow]
      filter:
        branches: ["main"]

workflows:
  deploy-workflow:
    tasks:
      - name: build-push-deploy
        cubes:
          - name: get-iam-token
            env:
              ID_TOKEN: ${{ tokens.SERVICE_CONNECTION.id_token }}
              YC_SA_ID: ${{ tokens.SERVICE_CONNECTION.service_account_id }}
            image: cr.yandex/sourcecraft/yc-iam:latest

          - name: setup-buildx
            action: docker/setup-buildx-action@v3.11.1

          - name: login
            action: docker/login-action@v3.5.0
            with:
              registry: cr.yandex
              username: iam
              password: ${{ cubes.get-iam-token.outputs.IAM_TOKEN }}

          - name: build-and-push
            action: docker/build-push-action@v6.18.0
            with:
              context: .
              file: Dockerfile
              platforms: linux/amd64
              tags: |
                cr.yandex/crpbebkq9vcs5fd300rv/flask-app:latest
              push: true

          - name: deploy
            action: yc-actions/yc-sls-container-deploy@v4
            with:
              yc-iam-token: ${{ cubes.get-iam-token.outputs.IAM_TOKEN }}
              folder-id: ${{ tokens.SERVICE_CONNECTION.folder_id }}
              container-name: flask-app
              public: "true"
              revision-service-account-id: ${{ tokens.SERVICE_CONNECTION.service_account_id }}
              revision-cores: "1"
              revision-memory: 512Mb
              revision-core-fraction: "100"
              revision-concurrency: "4"
              revision-execution-timeout: "30"
              revision-image-url: cr.yandex/crpbebkq9vcs5fd300rv/flask-app:latest
              # PORT задаёт платформа. DATABASE_URL задайте реальный (Managed PostgreSQL)
              # через yc/консоль или SourceCraft secrets — не коммитьте пароль в git.
              revision-env: |
                BASE_URL=https://bbas83kfi3oo3s9cv3na.containers.yandexcloud.net
                SENTRY_DSN=
